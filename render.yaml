services:
  - type: web
    name: AI-tools-servers # Or whatever you named your service
    env: python

    # CRITICAL CHANGE: Forcing a stable Python version.
    # Python 3.13 is too new and causes this library installation error.
    pythonVersion: "3.11"
    
    # Installs the FFMPEG program on the server's operating system
    systemPackages:
      - name: ffmpeg

    # Build and Start commands for production
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"

    # Link to your secure environment group for API keys
    # Make sure the 'name' here exactly matches the group name in your dashboard
    envVarGroups:
      - name: ai-tools-secrets 